name: Queueless CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fail on leftover merge conflict markers
        run: |
          if grep -rnE '^(<<<<<<<|>>>>>>>)( |$)' --exclude-dir=.git .; then
            echo "Merge conflict markers found"
            exit 1
          fi

      - name: Validate JSON files
        run: |
          find . -name "*.json" -not -path "./.git/*" -not -path "*/node_modules/*" -print0 \
            | xargs -0 -r -n1 python3 -m json.tool > /dev/null

      - name: CI passed
        run: echo "All checks passed"